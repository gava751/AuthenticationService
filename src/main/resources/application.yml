spring:
  profiles:
    default: local

  application:
    name: auth-service

  datasource:
    username: ${DB_USERNAME:auth_service}
    password: ${DB_PASSWORD:auth_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/master.yaml

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-min-32-characters-long!!}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}

logging:
  level:
    org.hibernate.SQL: debug
