spring:
  profiles:
    default: local

  application:
    name: auth-service

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/master.yaml

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    key-id: ${JWT_KEY_ID:auth-service-1}
    private-key: file:${JWT_PRIVATE_KEY_PATH}
    public-key: file:${JWT_PUBLIC_KEY_PATH}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  services:
    user-url: ${USER_SERVICE_URL:http://localhost:8082}
